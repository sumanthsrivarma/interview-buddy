spring:
  datasource:
    url: jdbc:postgresql://localhost:5431/interviewbuddy
    username: ibuser
    password: ibpass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

interview-buddy:
  cors:
    allowed-origins: http://localhost:4200
