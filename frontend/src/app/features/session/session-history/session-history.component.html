<mat-card>
  <mat-card-header>
    <mat-card-title>Session History</mat-card-title>
    <span class="spacer"></span>
    <a mat-raised-button color="primary" routerLink="/sessions/new">New Session</a>
  </mat-card-header>
  <mat-card-content>
    @if (sessions.length === 0) {
      <p class="empty">No completed sessions yet. <a routerLink="/sessions/new">Start one!</a></p>
    } @else {
      <table mat-table [dataSource]="sessions" class="full-width mat-elevation-z1">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let s">{{ s.name }}</td>
        </ng-container>
        <ng-container matColumnDef="topic">
          <th mat-header-cell *matHeaderCellDef>Topic</th>
          <td mat-cell *matCellDef="let s">{{ s.topic ?? 'Mixed' }}</td>
        </ng-container>
        <ng-container matColumnDef="difficulty">
          <th mat-header-cell *matHeaderCellDef>Difficulty</th>
          <td mat-cell *matCellDef="let s">{{ s.difficultyLevel ?? 'Mixed' }}</td>
        </ng-container>
        <ng-container matColumnDef="questionCount">
          <th mat-header-cell *matHeaderCellDef>Questions</th>
          <td mat-cell *matCellDef="let s">{{ s.questionCount }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Completed</th>
          <td mat-cell *matCellDef="let s">{{ s.completedAt | date:'dd MMM yyyy' }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let s">
            <button mat-stroked-button (click)="review(s.id)">Review</button>
            <button mat-stroked-button (click)="reattempt(s)" class="ml-8">Re-attempt</button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
